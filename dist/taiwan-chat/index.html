<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>丹陽さん</title><link rel="stylesheet" href="style.css?v=8"></head><body><div class="app"><aside id="sidebar" aria-label="チャット履歴"><div class="brand"><span class="brand-mark" aria-hidden="true">台</span><strong>丹陽さん</strong><button id="close-menu" class="icon-button" type="button" aria-label="会話一覧を収納する" title="会話一覧を収納する">×</button></div><button id="new-chat" type="button" class="new-chat">＋ 新しいチャット</button><p class="sidebar-label">チャット履歴</p><nav id="conversations" aria-label="保存済みの会話"></nav><p class="storage-note">履歴はこの端末に保存されます。</p></aside><button id="shade" class="shade" aria-label="会話一覧を閉じる" hidden></button><main><header><button id="open-menu" class="icon-button" type="button" aria-label="会話一覧を開く" aria-expanded="false">☰</button><div class="header-title"><h1 id="chat-title">新しいチャット</h1><span>丹陽さん</span></div><button id="delete-chat" class="icon-button" type="button" aria-label="この会話を削除">削除</button></header><div id="scroll-area"><div id="welcome"><span class="welcome-mark" aria-hidden="true">台</span><h2>台湾のこと、聞いてみよう。</h2><p>旅程、持ち物、台北の観光について相談できます。</p><div class="suggestions"><button type="button">班別研修で気をつけることは？</button><button type="button">台北で食べてみたい料理を教えて</button><button type="button">出発前に確認することを教えて</button></div></div><div id="messages" role="log" aria-label="会話" aria-live="polite"></div></div><div class="composer-area"><details id="usage-total" hidden><summary id="usage-summary"></summary><p id="usage-detail"></p><p id="usage-note"></p></details><section id="progress" aria-label="回答の進行状況" hidden><div class="progress-heading"><span id="progress-label" role="status" aria-live="polite"></span><span id="elapsed" aria-live="off"></span></div><ol id="progress-steps"><li>起動待ち</li><li>準備</li><li>回答作成</li><li>受け取り</li></ol></section><div class="status-row"><p id="status" role="status" aria-live="polite"></p><button id="retry" type="button" hidden>再試行</button></div><div id="location-preview" hidden><div><a id="location-map" target="_blank" rel="noopener noreferrer"></a><small>送信すると丹陽さんに共有され、この会話の履歴にも保存されます。</small></div><button id="remove-location" type="button" aria-label="現在地の添付を取り消す">×</button></div><form id="chat-form"><div id="attachment-tools"><button id="add-attachment" type="button" aria-label="添付を追加" aria-expanded="false" aria-controls="attach-menu">＋</button><div id="attach-menu" hidden><button id="share-location" type="button">⌖ 現在地を共有</button></div></div><label class="sr-only" for="question">メッセージ</label><textarea id="question" rows="1" maxlength="1500" placeholder="メッセージを入力…"></textarea><button id="send" type="submit" aria-label="送信">↑</button></form><p class="note">初回は起動に時間がかかります。大切な情報は学校・施設の公式案内も確認してください。</p></div></main></div><script type="module" src="chat.js?v=8"></script></body></html>
