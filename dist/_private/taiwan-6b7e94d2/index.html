<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>台湾相談 · 個人用</title><link rel="stylesheet" href="style.css"></head><body><main><header><div><small>PERSONAL PREVIEW</small><h1>台湾相談</h1></div><button id="clear" type="button">新しい会話</button></header><p class="intro">Luna mediumをGitHub上のCLIで実行します。起動待ちのため、回答に数分かかることがあります。</p><details id="settings"><summary>接続先</summary><label>専用の接続URL<input id="bridge" type="url" autocomplete="off" placeholder="https://…workers.dev/…"></label><button id="connect" type="button">接続先を設定</button></details><p id="status" role="status" aria-live="polite"></p><div id="messages" role="log" aria-label="会話" aria-live="polite"></div><form id="chat-form"><label for="question">質問</label><textarea id="question" rows="3" maxlength="1500" required placeholder="台北で班別研修をするとき、何に気をつければいい？"></textarea><button id="send" type="submit">送信</button></form><p class="note">名前や個人の連絡先は入力しないでください。会話は非公開のGitHub実行データとして保存されます。旅程の変更や最新の営業情報は公式案内を優先してください。</p></main><script src="chat.js"></script></body></html>
