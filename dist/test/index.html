<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>下部ナビの動き · プレビュー</title><link rel="stylesheet" href="./preview.css"><script src="./preview.js" type="module"></script><header><a href="../">クラス一覧</a><h1>もっちりナビのプレビュー</h1><p>2–3の画面で、下部のボタンを押す・横にスライドして試せます。</p></header><main><section class="controls"><h2>動きの設定</h2><label>収まるまでの時間 <output id="duration-value"></output><input id="duration" type="range" min="120" max="800" step="20" value="440"></label><label>跳ね返りの強さ <output id="bounce-value"></output><input id="bounce" type="range" min="1" max="1.7" step=".02" value="1.38"></label><label>ドラッグ中の伸び <output id="stretch-value"></output><input id="stretch" type="range" min="0" max=".1" step=".005" value=".035"></label><label>端で引っ張れる量 <output id="resistance-value"></output><input id="resistance" type="range" min="0" max=".5" step=".02" value=".16"></label><button id="reset">おすすめに戻す</button><p>設定はこの端末に保存されます。本番の動きには影響しません。</p><p>端末で「視差効果を減らす」などが有効な場合、動きを抑えます。</p></section><section class="phone"><iframe title="2–3 時間割の動作プレビュー" src="./demo.html"></iframe></section></main></html>
