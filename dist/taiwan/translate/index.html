<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <meta name="theme-color" content="#e7efe5">
  <title>対面翻訳 | 台湾研修旅行</title>
  <link rel="stylesheet" href="style.css?v=5">
  <script type="module" src="app.js?v=5"></script>
</head>
<body>
  <svg class="icon-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="translate-icon-flip" viewBox="0 0 24 24"><path d="M12 20V4m-5 5 5-5 5 5"/></symbol>
    <symbol id="translate-icon-send" viewBox="0 0 24 24"><path d="M21 3 3 10l7 3 3 8 8-18ZM10 13l11-10"/></symbol>
    <symbol id="translate-icon-retry" viewBox="0 0 24 24"><path d="M18 8a7 7 0 1 0 1.1 8M19 4v5h-5"/></symbol>
    <symbol id="translate-icon-clear" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3m-9 0 1 13h10l1-13M10 10v6m4-6v6"/></symbol>
    <symbol id="translate-icon-size" viewBox="0 0 24 24"><path d="m3 19 6-14 6 14M5 15h8m3-2h5m-2.5-2.5v5"/></symbol>
    <symbol id="translate-icon-max" viewBox="0 0 24 24"><path d="M9 4H4v5m11-5h5v5m0 6v5h-5M4 15v5h5"/></symbol>
    <symbol id="translate-icon-min" viewBox="0 0 24 24"><path d="M4 9h5V4m11 5h-5V4m0 16v-5h5M9 20v-5H4"/></symbol>
    <symbol id="translate-icon-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M6 11v1a6 6 0 0 0 12 0v-1M12 18v3m-3 0h6"/></symbol>
    <symbol id="translate-icon-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
    <symbol id="translate-icon-speaker" viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6l-5 4Zm12-1a4 4 0 0 1 0 6m2-8a7 7 0 0 1 0 10"/></symbol>
    <symbol id="translate-icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  </svg>
  <main class="conversation" aria-label="対面翻訳">
    <section class="panel partner" data-language="zh-TW" lang="zh-TW" aria-labelledby="chinese-heading">
      <header><h1 id="chinese-heading">台灣華語</h1><span data-role></span><a class="attribution" data-attribution href="https://www.deepl.com/translator" hidden>DeepL</a></header>
      <div class="message">
        <p class="phrase" data-phrase tabindex="0"></p>
        <textarea class="phrase phrase-input" aria-label="輸入台灣華語" maxlength="1000" hidden></textarea>
        <div class="actions">
          <button type="button" data-action="mic" aria-label="語音輸入" title="語音輸入" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#translate-icon-mic"/></svg></button>
          <button type="button" data-action="read" aria-label="朗讀" title="朗讀"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#translate-icon-speaker"/></svg></button>
          <button type="button" data-action="send" class="primary" aria-label="送出翻譯" title="送出翻譯" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#translate-icon-send"/></svg></button>
        </div>
      </div>
      <p class="feedback" data-feedback role="status"></p>
    </section>

    <div class="controls">
      <p id="direction-label"></p>
      <div class="control-row" role="group" aria-label="翻訳の操作">
        <button type="button" id="flip" aria-label="方向切替" title="方向切替"><svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><use href="#translate-icon-flip"/></svg></button>
        <button type="button" id="clear" aria-label="全消去" title="全消去"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#translate-icon-clear"/></svg></button>
        <button type="button" id="larger" aria-pressed="false" aria-label="文字を拡大" title="文字を拡大"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#translate-icon-size"/></svg></button>
        <button type="button" id="maximize" aria-label="最大化" title="最大化" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#translate-icon-max"/></svg></button>
        <a href="../" id="close-translation" aria-label="対面翻訳を閉じる" title="対面翻訳を閉じる"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#translate-icon-close"/></svg></a>
      </div>
      <p id="status" role="status" hidden></p>
    </div>

    <section class="panel" data-language="ja" aria-labelledby="japanese-heading">
      <header><h2 id="japanese-heading">日本語</h2><span data-role></span><button class="attribution" id="show-info" type="button" aria-label="DeepL翻訳について">DeepL</button></header>
      <div class="message">
        <p class="phrase" data-phrase tabindex="0" hidden></p>
        <textarea class="phrase phrase-input" aria-label="日本語を入力" maxlength="1000"></textarea>
        <div class="actions">
          <button type="button" data-action="mic" aria-label="音声入力" title="音声入力"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#translate-icon-mic"/></svg></button>
          <button type="button" data-action="read" aria-label="読み上げ" title="読み上げ"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#translate-icon-speaker"/></svg></button>
          <button type="button" data-action="send" class="primary" aria-label="翻訳する" title="翻訳する"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#translate-icon-send"/></svg></button>
        </div>
      </div>
      <p class="feedback" data-feedback role="status"></p>
    </section>
  </main>
  <dialog id="info" aria-labelledby="info-title">
    <h2 id="info-title">翻訳について</h2>
    <p>このアプリは <a href="https://www.deepl.com/pro-api">DeepL API</a> を使って自動翻訳します。翻訳時に入力した文章を DeepL に送信します。</p>
    <form method="dialog"><button>閉じる</button></form>
  </dialog>
</body>
</html>
