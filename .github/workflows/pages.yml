name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Validate timetable dates
        run: node --test scripts/test-timetable-dates.mjs
      - name: Configure view counting
        env:
          GOATCOUNTER_SITE: ${{ vars.GOATCOUNTER_SITE }}
        run: node scripts/write-stats-config.mjs
      - name: Configure Taiwan translation
        env:
          TAIWAN_TRANSLATION_ENDPOINT: ${{ vars.TAIWAN_TRANSLATION_ENDPOINT }}
        run: node scripts/write-translation-config.mjs
      - uses: actions/upload-pages-artifact@v5
        id: pages-artifact
        with:
          path: dist
      - name: Wait for the Pages artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.pages-artifact.outputs.artifact_id }}
        run: |
          curl --fail --silent --show-error --output /dev/null \
            --max-time 10 --retry 8 --retry-delay 3 --retry-all-errors \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID"
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
