name: Private Taiwan CLI
run-name: Taiwan CLI ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        required: true
        type: string
      messages:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: private-taiwan-cli
  cancel-in-progress: false
jobs:
  chat:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore CLI
        id: cli-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/taiwan-cli
          key: taiwan-cli-${{ runner.os }}-${{ runner.arch }}-0.169.0-v1
      - name: Install fixed CLI
        if: steps.cli-cache.outputs.cache-hit != 'true'
        run: npm install --prefix "$HOME/.cache/taiwan-cli" --no-audit --no-fund --ignore-scripts @openai/codex@0.169.0
      - name: Configure CLI path
        run: echo "$HOME/.cache/taiwan-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Answer privately
        env:
          CODEX_AUTH_JSON: ${{ secrets.TAIWAN_CODEX_AUTH_JSON }}
        run: node run.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: private-answer
          path: result.json
          retention-days: 1
